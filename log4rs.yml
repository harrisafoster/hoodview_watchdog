appenders:
    stdout:
        kind: console
        encoder:
            pattern: "{d(%+)(utc)} [{f}:{L}] {h({l})} {M}:{m}{n}"
        filters:
            - kind: threshold
              level: info
    rollingfile:
        kind: rolling_file
        path: "log/hv_watchdog.log"
        encoder:
            pattern: "[{d(%Y-%m-%dT%H:%M:%S%.6f)} {h({l}):<5.5} {M}] {m}{n}"
        policy:
            kind: compound
            trigger:
                kind: size
                limit: 1 mb
            roller:
                kind: delete
root:
    level: info
    appenders:
        # Uncomment line below to see logging in terminal
        # - stdout
        - rollingfile